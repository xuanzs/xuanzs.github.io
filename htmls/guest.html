<!DOCTYPE html>
<html lang="en">
  <head>

    <title>View</title>
    <link rel="stylesheet" href="../css/guest.css" />

            </tr>
            <tr>

              <td><button></button></td>
              <td><button></button></td>
              <td><button></button></td>
              <td><button></button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="right">
        <div class="r1">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>4</button>
          <button>5</button>

          <button>8</button>

      <div class="bottom">
        <button class="Clear">Clear All</button>
        <button class="Delete">Delete</button>
        <button class="Submit">Submit</button>
      </div>
    </div>
    <div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
        <button class="popup-close" id="popupClose" aria-label="Close">✕</button>
        <h4 id="popupTitle"></h4>
        <div class="babies">
            <h5></h5>
