        :root{
            --ink:#0b0613;
            --purple:#5a23a1;
            --purple-deep:#3a1574;
            --ice:#7cf2ff;
            --chalk:#f3f3f3;
            }

            /* 3) 页面背景：紫黑渐变 + 暗角 */
            html, body{ height:100%; }
            body{
            /* 保留你的布局属性 */
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;

            color: var(--chalk);
            background:url("../public/background/Viewbackground.png")
              no-repeat center/cover fixed;
            }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(2px);
            z-index: 5;
            visibility: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* margin-left: -35px; */
        }

        .title {
            display: flex;
            font-size: 50px;
            margin-bottom: 10px;
        }
        .top, .bottom {
            display: flex;
            justify-content: center;
            text-align: center;
            flex-direction: row;
            gap: 10px;
            /* margin-bottom: 35px; */
        }

        .top {
            margin-bottom: 100px;
        }

        .bottom {
            margin-bottom: 35px;
        }

        .team1, .team2, .team3, .team4, .team5, .team6, .team7, .team8, .team9, .team10, .team11, .team12, .team13, .team14{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h5 {
            color: rgb(165, 200, 245);
            margin: 0 0 10px 0;
            margin-bottom: 4px;
            font-size: 25px;
            height: 36px;
        }

        table {
            font-family: "Impact", "Anton", system-ui, sans-serif;
            border-collapse: separate; 
            border-spacing: 0; 
            border: 2px solid #444;
            min-width: 50px;
            background-color: #fff;
            border-radius: 16px; 
            overflow: hidden;
        }

        td {
            border: 1px solid #aaa;
            padding: 15px 15px;
            text-align: center;
            font-size: 20px;
        }

        .btn-shutdown {
            background-color: black !important;
            color: black !important;
        }

        /* .popup{
            display: flex;

    #popup{
    position: fixed;              /* 不要 absolute */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    visibility: hidden;
    z-index: 10;
    background: transparent;      /* ✅ 没有灰色底 */
    padding: 0;                   /* 不需要 padding 也行 */
    color: #ff2a2a;               /* ✅ 红色字 */
    font-weight: 900; 
    letter-spacing: 0.04em;
    font-size: clamp(100px, 10vw, 200px);
    text-shadow:
        0 6px 0 rgba(0,0,0,0.85),
        0 0 18px rgba(255,42,42,0.45);
    }

    /* ✅ 每一个 team（team1~team14）后面加一块“底板” */
.top > div, .bottom > div{
  padding: 12px 12px 14px;
  border-radius: 18px;

  /* 你说的“厚一点”(更明显的底) */
  background: linear-gradient(180deg,
    rgba(255,255,255,.08),
    rgba(0,0,0,.28)
  );
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 14px 36px rgba(0,0,0,.45);
  backdrop-filter: blur(6px);
}

/* ✅ 让 table 不要贴边，看起来更像卡片里的内容 */
.top table, .bottom table{
  background: rgba(255,255,255,.92);
  border: 2px solid rgba(0,0,0,.35);
}

/* ✅ team 标题字更“厚” */
.top h5, .bottom h5{
  font-weight: 900;
  letter-spacing: .04em;
  text-shadow: 0 2px 0 rgba(0,0,0,.6);
}

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const firebaseConfig = {
            apiKey: "AIzaSyBcWYGKCj42Oz41p3SJA2drBnU7FMs4MhU",
            authDomain: "awe-db.firebaseapp.com",
            projectId: "awe-db",
            storageBucket: "awe-db.firebasestorage.app",
            messagingSenderId: "70964725621",
            appId: "1:70964725621:web:42cdec6e7b963eb3a2b53c",
            measurementId: "G-9EH2X0QJHR"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let stationTopTeamsMap = new Map();

        let shutdownStation = null;
        let currentRestoreTeams = [];

        const assignmentsCache = new Map();

        db.collection("stationSubmission").onSnapshot(snapshot => {
            stationTopTeamsMap.clear();
            snapshot.forEach(doc => {
                const data = doc.data();
                const top5 = getTop5Teams(data);
                const match = doc.id.match(/(\d+)/);
                if (!match) return;
                const stationNumber = parseInt(match[1]);
                stationTopTeamsMap.set(stationNumber, top5);
            });

            refreshAllTeams();
        });

        db.collection("skills").doc("shutdown").onSnapshot((doc) => {
            if (!doc.exists) {
                shutdownStation = null;
            } else {
                const data = doc.data();
                shutdownStation = data.station || null;
            }
            refreshAllTeams();
        });

        db.collection("skills").doc("restore").onSnapshot((doc) => {
            console.log("restore snapshot triggered");
            if (!doc.exists) {
                currentRestoreTeams = [];
            } else {
                const data = doc.data();
                currentRestoreTeams = data.teams || [];
            }
            refreshAllTeams();
        });

        function refreshAllTeams() {
            for (let i = 1; i <= 14; i++) {
                const currentTeamId = "team" + i;
                const data = assignmentsCache.get(currentTeamId);
                if (data) {
                    updateTeamDisplay(i, data);
                }
            }
        }

        function startAssignmentListener(teamId) {
            const currentTeamId = "team" + teamId;

            db.collection("assignments").doc(currentTeamId).onSnapshot(doc => {
                if (!doc.exists) {
                    console.warn(`${currentTeamId} doc not found.`);
                    return;
                }

                const data = doc.data();assignmentsCache.set(currentTeamId, data);

                updateTeamDisplay(teamId, data);
            });
        }

        function updateTeamDisplay(teamId, data) {
            // console.log(`Updating team ${teamId}`);

            const currentTeamId = "team" + teamId;

            const container = document.querySelector(`.team${teamId}`);

            if (!container) {
                console.warn(`.team${teamId} container not found in DOM.`);
                return;
            }

            const title = container.querySelector('h5');
            const cells = container.querySelectorAll('td');

            title.textContent = data.name || "";

            if (Array.isArray(data.assignments)) {
                data.assignments.forEach(assignment => {
                    const positionIndex = assignment.position - 1;
                    const label = assignment.value || "";
                    const cell = cells[positionIndex];

                    if (!cell) {
                        console.warn(`Cell at index ${positionIndex} not found.`);
                        return;
                    }

                    cell.textContent = label;

                    const match = label.match(/^S?(\d+)$/i);
                    if (match) {
                        const stationNumber = parseInt(match[1]);
                        const topTeams = stationTopTeamsMap.get(stationNumber);

                        // console.log(`Station #${stationNumber} top teams:`, topTeams);


                        if (topTeams && topTeams.includes(currentTeamId)) {
                            console.log(`Team ${teamId} is in top 5 of station ${stationNumber}`);

                            cell.style.background = "linear-gradient(45deg, #0A4618FF, #1EFF00FF)";
                            cell.style.color = "white";
                        } else {
                            // console.log(`Team ${teamId} is NOT in top 5 of station ${stationNumber}`);

                            cell.style.background = "#E6E6E6FF";
                            cell.style.color = "black";
                        }
                    } else {
                        console.log(`Couldn't extract station number from label "${label}"`);

                        cell.style.background = "white";
                        cell.style.color = "black";
                    }
                });
            }

            if (shutdownStation && !currentRestoreTeams.includes(currentTeamId)) {
                cells.forEach(cell => {
                    if (cell.textContent === shutdownStation) {
                        cell.classList.add("btn-shutdown");
                        console.log(`Station ${shutdownStation} shut down for team ${currentTeamId}`);
                    } else {
                        cell.classList.remove("btn-shutdown");
                    }
                });
            } else {
                cells.forEach(cell => cell.classList.remove("btn-shutdown"));
            }
        }

        for (let i = 1; i <= 14; i++) {
            startAssignmentListener(i);
        }

        function getTop5Teams(stationData) {
            const MAX_ROWS = 4;
            const MAX_PAIRS = 5;
            const topPairs = Array.from({ length: MAX_PAIRS }, () => ({ team: null, baby: -Infinity }));

            for (let row = 1; row <= MAX_ROWS; row++) {
                const rowData = stationData[`row${row}`];
                if (!rowData || !rowData.team || !rowData.baby) continue;

                for (let i = 0; i < MAX_PAIRS; i++) {
                    const team = rowData.team[i];
                    const baby = parseFloat(rowData.baby[i]);
                    if (team && !isNaN(baby) && baby > topPairs[i].baby) {
                        topPairs[i] = { team, baby };
                    }
                }
            }

            return topPairs.map(pair => pair.team).filter(Boolean);
        }

        const countdownTarget = new Date("2025-11-27T22:00:00").getTime();
        const overlay = document.getElementById("overlay");
        const popup = document.getElementById("popup");
        const alarm = new Audio('../sound/alarm.mp3');

        let animationIntervalId = null;
        let countdownIntervalId = null;
        let animationStarted = false;

        let posX = 100;
        let posY = 100;
        let velocityX = 3;
        let velocityY = 2;

        function animate() {
            const wordWidth = popup.offsetWidth;
            const wordHeight = popup.offsetHeight;
            const maxX = window.innerWidth - wordWidth;
            const maxY = window.innerHeight - wordHeight;

            posX += velocityX;
            posY += velocityY;

            if (posX >= maxX || posX <= 0) {
                velocityX = -velocityX;
                posX = Math.max(0, Math.min(posX, maxX));
            }

            if (posY >= maxY || posY <= 0) {
                velocityY = -velocityY;
                posY = Math.max(0, Math.min(posY, maxY));
            }

            popup.style.left = posX + 'px';
            popup.style.top = posY + 'px';

            requestAnimationFrame(animate);
        }


        function updateCountdown() {
            const now = Date.now();
            const distance = countdownTarget - now;
            
            if (distance < 0) {
                document.getElementById("countdown").style.visibility = "hidden";
                overlay.style.visibility = "visible";
                popup.style.visibility = "visible";

                clearInterval(countdownIntervalId);

                // alarm.play().catch(e => {
                //     console.warn("Audio play was prevented:", e);
                // });

                startAnimation();

                if (!animationStarted) {
                    animationStarted = true;
                    animate();
                }
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const pad = (num) => num.toString().padStart(2, '0');

            document.getElementById("countdown").textContent =
            `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown();
    });
        
    </script>
</body>
