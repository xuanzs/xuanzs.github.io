<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Times Countdown</title>
  <link rel="stylesheet" href="../css/times_countDown.css" />
  <script src="../js/times_countDown.js" defer></script>
</head>

<audio id="beepAudio" src="../sound/timesup.mp3" preload="auto"></audio>

<body>
  <div class="app">
    <h1 class="title">COUNTDOWN 倒计时</h1>

    <!-- ✅ 一开始只显示确认面板 -->
    <div class="input-panel" id="inputPanel">
      <div class="default-text">记录这个时间，每次 30 分钟响铃一次</div>
      <button id="startBtn" class="start-btn">START 确定</button>
      <p class="hint">* 开始后不可暂停/结束（除非 refresh）</p>
    </div>
  </div>

<div class="timer-wrap hidden" id="timerWrap">
  <div class="timer" id="timer">
    <span id="dHH">00</span><span class="colon">:</span>
    <span id="dMM">00</span><span class="colon">:</span>
    <span id="dSS">00</span>
  </div>
  <div id="status" class="status">READY</div>

  <!-- ✅ 路径：从 htmls/ 到根目录 sound/ -->
  <audio id="beepAudio" src="../sound/timesup.mp3" preload="auto"></audio>
</div>

</body>
</html>
