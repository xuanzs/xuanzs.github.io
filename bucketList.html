                <button id="team6"></button>
                <button id="team7"></button>

                <button id="team9"></button>
                <button id="team10"></button>
                <button id="team11"></button>
                <button id="team12"></button>
                <button id="team13"></button>
                <button id="team14"></button>
                
            </div>
        </div>

            <div class="selfieBackBtn">
                <button onclick="backNpcMainPage()">< Back</button>
            </div>
            <div class="selfieTitle">
                <h3>Group</h3>

        <!-- 100 张微笑 -->
        <div class="smilePage " id="smilePage">
            <div class="overlay" id="overlay">
                <div class="spinner"></div>
                <div class="loading">Uploading Image... Please wait.</div>
            </div>

            <div class="smileBackBtn">
                <button onclick="backMainPage()">< Back</button>
            </div>
            <div class="smileTitle">
                <h3>集齐100个笑容</h3>
            </div>
            <input type="file" id="smileUpload" accept="image/*">
            <br><br>

            <div id="imagePreview"></div>

            <br>

            <button id="smileSubmitBtn">Submit</button>

            <div id="images"></div>
        </div>
