<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <title>Log In</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh;
      margin: 0;
      font-family: 'Times New Roman', Times, serif;
    }

    .btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 1;
    }

    .btns button {
      padding: 10px 60px;
      border: 0;
      outline: none;
      font-size: 20px;
      border-radius: 30px;
      color: black;
      background-color: rgb(188, 188, 188);
    }

    .btns button:hover {
      cursor: pointer;
      background-color: gray;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      visibility: hidden;
      z-index: 5;
    }

    .overlay.show {
      visibility: visible;
    }

    .adminPopup{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: rgb(184, 184, 184);
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .gmPopup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: #c0c0c0;
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .guestPopup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: #c0c0c0;
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .open-popup {
      visibility: visible;
    }

    .popupBtns {
      display: flex;
      gap: 10px;
    }

    .popupBtns button {
      padding: 5px 15px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Overlay Background -->
  <div class="overlay" id="overlay"></div>

  <!-- Button Options -->
  <div class="btns">
    <button onclick="openAdminPopup()">Admin</button>
    <button onclick="openGMPopup()">GM</button>
    <button onclick="openGuestPopup()">Guest</button>
  </div>

  <!-- Admin Popup -->
  <div class="adminPopup" id="popupAdmin">
    <label for="idAdmin">Admin ID:</label>
    <input type="text" id="adminId">
    <label for="pwAdmin">PW:</label>
    <input type="password" id="adminPw">
    <div class="popupBtns">
      <button onclick="closeAdminPopup()">Cancel</button>
      <button onclick="submitAdminLogin()">OK</button>
    </div>
  </div>

  <!-- GM Popup -->
  <div class="gmPopup" id="popupGM">
    <label for="idGM">GM ID:</label>
    <input type="text" id="gmId">
    <label for="pwGM">PW:</label>
    <input type="password" id="gmPw">
    <div class="popupBtns">
      <button onclick="closeGMPopup()">Cancel</button>
      <button onclick="submitGMLogin()">OK</button>
    </div>
  </div>

  <!-- Guest Popup -->
  <div class="guestPopup" id="popupGuest">
    <label for="teams">Choose your team:</label>
    <select name="team" id="teams">
      <option value="">Select</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
    </select>
    <div class="popupBtns">
      <button onclick="closeGuestPopup()">Cancel</button>
      <button onclick="submitTeam()">OK</button>
    </div>
  </div>

  <script>
    const adminId = document.getElementById("adminId");
    const adminPw = document.getElementById("adminPw");

    const gmId = document.getElementById("gmId");
    const gmPw = document.getElementById("gmPw");

    const popupAdmin = document.getElementById("popupAdmin");
    const popupGM = document.getElementById("popupGM");
    const popupGuest = document.getElementById("popupGuest");
    const overlay = document.getElementById("overlay");

    function openAdminPopup() {
      popupAdmin.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeAdminPopup() {
      popupAdmin.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function openGMPopup() {
      popupGM.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeGMPopup() {
      popupGM.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function openGuestPopup() {
      popupGuest.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeGuestPopup() {
      popupGuest.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function submitAdminLogin() {
      const enteredId = adminId.value.trim();
      const enteredPw = adminPw.value.trim();

      db.collection("authentication").doc("admin").get()
        .then((doc) => {
          if (doc.exists) {
            const data = doc.data();
            const correctId = data.id;
            const correctPw = data.password;

            if (enteredId === correctId && enteredPw === correctPw) {
              alert("Welcome!");
            } else if (enteredId !== correctId && enteredPw === correctPw) {
              alert("Id incorrect!");
            } else if (enteredId === correctId && enteredPw !== correctPw) {
              alert("Password incorrect!");
            } else {
              alert("Id and Password incorrect!");
            }
          } else {
            alert("Admin credentials not found in database.")
          }
        })
        .catch((error) => {
          console.error("Error retrieving admin credentials:", error);
          alert("Something went wrong. Please try again later.");
        })
    }

    function submitGMLogin() {
      const enteredId = gmId.value.trim();
      const enteredPw = gmPw.value.trim();

      if (!enteredId || !enteredPw) {
        alert("Please enter both ID and password.");
        return;
      }

      db.collection("authentication").doc("gamemaster").get()
        .then(doc => {
          if (!doc.exists) {
            alert("No GM data found.");
            return;
          }

          const accounts = doc.data().accounts;

          for (const key in accounts) {
            const account = accounts[key];
            if (account.id === enteredId) {
              if (account.password === enteredPw) {
                alert("Welcome GM" + enteredId);

                location.href = `gm.html?id=${enteredId}`;
                return;
              } else {
                alert("Incorrect password");
                return;
              }
            }
          }

          alert("GM ID not found.");
        })
        .catch(error => {
          console.error("Error checking GM credentials:", error);
          alert("Something went wrong.")
        });
    }

    //       alert("GM ID not found.");
    //     })
    //     .catch(error => {

    //       alert("Something went wrong.");
    //     });
    // }


    function submitTeam() {
      const team = document.getElementById("teams").value;
      if (!team) {
        alert("Please select a team.");
        return;
      }

      // Example: Redirect or handle logic
      alert("Selected team: " + team);
      location.href = `guest.html?team=${team}`;
    }
  </script>
  <script src="dbInsert.js"></script>
</body>
</html>
