<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <title>Log In</title>
  <style>

    
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 100vh;
    margin: 0;
    font-family: 'Times New Roman', Times, serif;

    background: radial-gradient(circle at top,
      #5a23a1 0%,
      #3a1574 40%,
      #18071f 100%);
    color: #fdfdfd;
  }

    .btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 1;
    }

    .btns button {
      width: 220px;
      padding: 20px 0;
      margin: 20px;
      border: none;
      outline: none;
      font-size: 18px;
      letter-spacing: 0.03em;

      /* 玻璃感背景 */
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fdfdfd;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(8px);

      transition: transform 0.15s ease, box-shadow 0.15s ease,
                  background 0.15s ease, letter-spacing 0.15s ease;
      cursor: pointer;
    }



    .btns button:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-3px);
      box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.32);
      letter-spacing: 0.06em;
    }

    /* active：按下去一点 */
    .btns button:active {
      transform: translateY(-1px);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.26);
    }

    .btns .btn-admin {
      color: rgba(255, 179, 193) ;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 179, 193, 0.6);
    }

    .btns .btn-gm {
      color: rgba(176, 213, 255);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(176, 213, 255, 0.6);
    }

    .btns .btn-guest {
      color: rgba(182, 255, 182);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(182, 255, 182, 0.6);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      visibility: hidden;
      z-index: 5;
    }

    .overlay.show {
      visibility: visible;
    }

    .adminPopup{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: rgb(184, 184, 184);
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .gmPopup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: #c0c0c0;
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .guestPopup {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      min-width: 260px;
      max-width: 320px;
      background: #fdfdfd;
      border-radius: 16px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 18px 16px;
      gap: 12px;
      z-index: 10;
      visibility: hidden;
      box-shadow:
        0 14px 28px rgba(0,0,0,0.25),
        0 10px 10px rgba(0,0,0,0.22);
    }

    /* 标题 */
    .guestPopup .popup-title {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 600;
      color: #222;
      text-align: center;
    }

    /* Label */
    .guestPopup .popup-label {
      font-size: 14px;
      margin-bottom: 4px;
      color: #444;
    }

    /* Select */
    .guestPopup .popup-select {
      width: 100%;
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      outline: none;
      box-sizing: border-box;
    }

    .guestPopup .popup-select:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, .15);
    }

    /* 底部按钮区域 */
    .popupBtns {
      display: flex;
      justify-content: center;   /* ✅ 居中 */
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .popupBtns .popup-btn {
      flex: 0 0 90px;            /* ✅ 固定宽度，两边一样宽 */
      height: 32px;
      border-radius: 999px;      /* 圆角 pill */
      border: none;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
      transition: background .15s, transform .1s, box-shadow .1s;
    }

    /* 按钮通用样式 */
    .popupBtns button {
      padding: 6px 16px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s, transform .1s, box-shadow .1s;
    }

    .popupBtns .popup-btn-cancel {
      background: #f2f2f2;
      color: #333;
    }

    .popupBtns .popup-btn-cancel:hover {
      background: #e4e4e4;
    }

    /* OK：蓝色 */
    .popupBtns .popup-btn-ok {
      background: #007bff;
      color: #fff;
    }

    .popupBtns .popup-btn-ok:hover {
      background: #0065d1;
    }

    /* 按下去的手感 */
    .popupBtns .popup-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    .open-popup {
      visibility: visible;
    }


  </style>
</head>
<body>
  <!-- Overlay Background -->
  <div class="overlay" id="overlay"></div>

  <!-- Button Options -->
  <div class="btns">
    <button class="btn-admin" onclick="openAdminPopup()">Admin</button>
    <button class="btn-gm" onclick="openGMPopup()">GM</button>
    <button class="btn-guest" onclick="openGuestPopup()">Guest</button>
  </div>

  <!-- Admin Popup -->
  <div class="adminPopup" id="popupAdmin">
    <label for="idAdmin">Admin ID:</label>
    <input type="text" id="adminId">
    <label for="pwAdmin">PW:</label>
    <input type="password" id="adminPw">
    <div class="popupBtns">
      <button onclick="closeAdminPopup()">Cancel</button>
      <button onclick="submitAdminLogin()">OK</button>
    </div>
  </div>

  <!-- GM Popup -->
  <div class="gmPopup" id="popupGM">
    <label for="idGM">GM ID:</label>
    <input type="text" id="gmId">
    <label for="pwGM">PW:</label>
    <input type="password" id="gmPw">
    <div class="popupBtns">
      <button onclick="closeGMPopup()">Cancel</button>
      <button onclick="submitGMLogin()">OK</button>
    </div>
  </div>

  <!-- Guest Popup -->
  <div class="guestPopup" id="popupGuest">
    <h2 class="popup-title">Choose your team</h2>

    <label for="teams" class="popup-label">Team number</label>
    <select name="team" id="teams" class="popup-select">
      <option value="">Select…</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
    </select>

    <div class="popupBtns">
      <button class="popup-btn popup-btn-cancel" onclick="closeGuestPopup()">Cancel</button>
      <button class="popup-btn popup-btn-ok" onclick="submitTeam()">OK</button>
    </div>
  </div>


  <script>
    const adminId = document.getElementById("adminId");
    const adminPw = document.getElementById("adminPw");

    const gmId = document.getElementById("gmId");
    const gmPw = document.getElementById("gmPw");

    const popupAdmin = document.getElementById("popupAdmin");
    const popupGM = document.getElementById("popupGM");
    const popupGuest = document.getElementById("popupGuest");
    const overlay = document.getElementById("overlay");

    function openAdminPopup() {
      popupAdmin.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeAdminPopup() {
      popupAdmin.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function openGMPopup() {
      popupGM.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeGMPopup() {
      popupGM.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function openGuestPopup() {
      popupGuest.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeGuestPopup() {
      popupGuest.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function submitAdminLogin() {
      const enteredId = adminId.value.trim();
      const enteredPw = adminPw.value.trim();

      db.collection("authentication").doc("admin").get()
        .then((doc) => {
          if (doc.exists) {
            const data = doc.data();
            const correctId = data.id;
            const correctPw = data.password;

            if (enteredId === correctId && enteredPw === correctPw) {
              alert("Welcome!");
              location.href = "admin.html";
              return;
            } else if (enteredId !== correctId && enteredPw === correctPw) {
              alert("Id incorrect!");
            } else if (enteredId === correctId && enteredPw !== correctPw) {
              alert("Password incorrect!");
            } else {
              alert("Id and Password incorrect!");
            }
          } else {
            alert("Admin credentials not found in database.")
          }
        })
        .catch((error) => {
          console.error("Error retrieving admin credentials:", error);
          alert("Something went wrong. Please try again later.");
        })
    }

    function submitGMLogin() {
      const enteredId = gmId.value.trim();
      const enteredPw = gmPw.value.trim();

      if (!enteredId || !enteredPw) {
        alert("Please enter both ID and password.");
        return;
      }

      db.collection("authentication").doc("gamemaster").get()
        .then(doc => {
          if (!doc.exists) {
            alert("No GM data found.");
            return;
          }

          const accounts = doc.data().accounts;

          for (const key in accounts) {
            const account = accounts[key];
            if (account.id === enteredId) {
              if (account.password === enteredPw) {
                alert("Welcome GM" + enteredId);

                location.href = `gm.html?id=${enteredId}`;
                return;
              } else {
                alert("Incorrect password");
                return;
              }
            }
          }

          alert("GM ID not found.");
        })
        .catch(error => {
          console.error("Error checking GM credentials:", error);
          alert("Something went wrong.")
        });
    }

    //             return;

    //             return;
    //           }
    //         }
    //       }

    //       alert("GM ID not found.");
    //     })
    //     .catch(error => {
    //       console.error("Error checking GM credentials:", error);
    //       alert("Something went wrong.");
    //     });
    // }


    function submitTeam() {
      const team = document.getElementById("teams").value;
      if (!team) {
        alert("Please select a team.");
        return;
      }

      // Example: Redirect or handle logic
      alert("Selected team: " + team);
      location.href = `guest.html?team=${team}`;
    }
  </script>
  <script src="dbInsert.js"></script>
</body>
</html>
