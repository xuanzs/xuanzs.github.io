  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh;
      margin: 0;
      font-family: 'Times New Roman', Times, serif;
    }

    .btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 1;
    }

    .btns button {
      padding: 10px 60px;
      border: 0;
      outline: none;
      font-size: 20px;
      border-radius: 30px;
      color: black;
      background-color: rgb(188, 188, 188);
    }

    .btns button:hover {
      cursor: pointer;
      background-color: gray;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      visibility: hidden;
      z-index: 5;
    }

    .overlay.show {
      visibility: visible;
    }

    .adminPopup{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: rgb(184, 184, 184);
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .guestPopup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: #c0c0c0;
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .open-popup {
      visibility: visible;
    }

    .popupBtns {
      display: flex;
      gap: 10px;
    }

    .popupBtns button {
      padding: 5px 15px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>

  <!-- Overlay Background -->
  <div class="overlay" id="overlay"></div>

  <!-- Button Options -->
  <div class="btns">
    <button onclick="openAdminPopup()">Admin</button>
    <button onclick="alert('GM clicked')">GM</button>
    <button onclick="openGuestPopup()">Guest</button>
  </div>

  <!-- Admin Popup -->
  <div class="adminPopup" id="popupAdmin">
    <label for="idAdmin">ID:</label>
    <input type="text" id="adminId">
    <label for="pwAdmin">PW:</label>
    <input type="password" id="adminPw">
    <div class="popupBtns">
      <button onclick="closeAdminPopup()">Cancel</button>
      <button onclick="submitAdminLogin()">OK</button>
    </div>
  </div>

  <!-- Guest Popup -->
  <div class="guestPopup" id="popupGuest">
    <label for="teams">Choose your team:</label>

    <div class="popupBtns">
      <button onclick="closeGuestPopup()">Cancel</button>
      <button onclick="submitTeam()">OK</button>
    </div>
  </div>

    function submitAdminLogin() {
      const enteredId = id.value.trim();
