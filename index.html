<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View</title>
    <style>
        body{
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        #t1{
            border: 1px solid black;
            margin-bottom: 20px solid black;
            padding: 12px;

            button{
                cursor: pointer;
                width: 30px;
                height: 30px;
                background-color: white;
                border: none;
            }

            .selected{
                    background-color: rgb(191, 191, 191);
                }
        }
        td{
            border: 1px solid black;
            padding: 0;
            background-color: white;
        }
        .right1 button{
            cursor: pointer;
            width: 30px;
            height: 30px;
        }
        
    </style>
</head>
<body>
    
    <div class="table1">
        <div class="table">
            <h1>Table 1</h1>
        <table id="t1">
            <tbody>
                <tr>
                    <td>
                        <button></button>
                    </td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                </tr>
                <tr>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                </tr>
                <tr>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                </tr>
                <tr>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                </tr>
                <tr>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                    <td><button></button></td>
                </tr>
            </tbody>
        </table>
        </div>
        <div class="right1">
            <div class="r1">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
            </div>
            <div class="r2">
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>10</button>
            </div>
            <div class="r3">
                <button>11</button>
                <button>12</button>
                <button>13</button>
                <button>14</button>
                <button>15</button>
            </div>
            <div class="r4">
                <button>16</button>
                <button>17</button>
                <button>18</button>
                <button>19</button>
                <button>20</button>
            </div>
            <div class="r5">
                <button>21</button>
                <button>22</button>
                <button>23</button>
                <button>24</button>
                <button>25</button>
            </div>
        </div>
        <div class="bottom">
            <button class="Clear">Clear All</button>
            <button class="Delete">Delete</button>
        </div>
    </div>
    
    <script>
        const tableButtons = document.querySelectorAll("#t1 button");
        const rightButtons = document.querySelectorAll('.right1 button');
        const clearAllButtons = document.querySelectorAll('.bottom .Clear')
        const deleteButtons = document.querySelectorAll('.bottom .Delete')

        let selectedTableButton = null;
        const assignedButtonsMap = new Map();
        
        tableButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                tableButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTableButton = btn;
            });
        });

        rightButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const usedRightBtn = assignedButtonsMap.get(selectedTableButton);
                if(selectedTableButton) {
                    if(usedRightBtn){
                        usedRightBtn.disabled = false;
                        assignedButtonsMap.delete(selectedTableButton)
                    }
                    tableButtons.forEach(b => b.classList.remove('selected'));
                    selectedTableButton.textContent = btn.textContent;
                    btn.disabled = true;
                    assignedButtonsMap.set(selectedTableButton, btn)
                    selectedTableButton = null;
                }
            })
        })

        deleteButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                selectedTableButton.textContent = "";
                const usedRightBtn = assignedButtonsMap.get(selectedTableButton);
                if(usedRightBtn){
                    usedRightBtn.disabled = false;
                    assignedButtonsMap.delete(selectedTableButton)
                }
                tableButtons.forEach(b => b.classList.remove('selected'));
                selectedTableButton = null;
            })
        })

        clearAllButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                tableButtons.forEach(tableBtn => {
                    tableBtn.textContent = "";
                    tableBtn.classList.remove("selected");
                });

                rightButtons.forEach(rightBtn => {
                    rightBtn.disabled = false;
                });

                assignedButtonsMap.clear();
                selectedTableButton = null;
            })
        })
    </script>
</body>
</html>
