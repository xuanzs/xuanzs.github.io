<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <title>Log In</title>
  <style>

    
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 100vh;
    margin: 0;
    font-family: 'Times New Roman', Times, serif;

    background:
        url("public/background/background.png") no-repeat center/cover,
        radial-gradient(circle at top,
          #5a23a1 0%,
          #3a1574 40%,
          #18071f 100%);
      color: #fdfdfd;
  }

    .btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 1;
    }

    .btns button {
      width: 220px;
      padding: 20px 0;
      margin: 20px;
      border: none;
      outline: none;
      font-size: 18px;
      letter-spacing: 0.03em;

      /* 玻璃感背景 */
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fdfdfd;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(8px);

      transition: transform 0.15s ease, box-shadow 0.15s ease,
                  background 0.15s ease, letter-spacing 0.15s ease;
      cursor: pointer;
    }



    .btns button:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-3px);
      box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.32);
      letter-spacing: 0.06em;
    }

    /* active：按下去一点 */
    .btns button:active {
      transform: translateY(-1px);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.26);
    }

    .btns .btn-admin {
      color: rgba(255, 179, 193) ;
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 179, 193, 0.6);
    }

    .btns .btn-gm {
      color: rgba(176, 213, 255);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(176, 213, 255, 0.6);
    }

    .btns .btn-guest {
      color: rgba(182, 255, 182);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(182, 255, 182, 0.6);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      visibility: hidden;
      z-index: 5;
    }

.overlay.show{
  visibility: visible;
  background: rgba(5, 3, 12, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background .2s ease;
}

    .adminPopup{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: rgb(184, 184, 184);
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

    .gmPopup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      background: #c0c0c0;
      border-radius: 6px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      gap: 10px;
      z-index: 10;
      visibility: hidden;
    }

.guestPopup{
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;

  min-width: 280px;
  max-width: 340px;
  width: 86vw;

  padding: 18px 18px 16px;
  border-radius: 20px;

  /* 玻璃紫卡片 */
  background:
    linear-gradient(180deg, rgba(255,255,255,0.96), rgba(245,240,255,0.96));
  border: 1px solid rgba(255,255,255,0.9);

  box-shadow:
    0 18px 45px rgba(0,0,0,0.35),
    0 0 0 1px rgba(124,242,255,0.15);

  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(.96);
  z-index: 10;

  visibility: hidden;
  opacity: 0;
  transition: opacity .18s ease, transform .18s ease;
}

.adminPopup,
.gmPopup{
  display:flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;

  min-width: 260px;
  max-width: 320px;
  width: 86vw;

  padding: 18px;
  border-radius: 18px;

  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(245,240,255,0.96));
  border: 1px solid rgba(255,255,255,0.9);

  box-shadow:
    0 18px 45px rgba(0,0,0,0.35),
    0 0 0 1px rgba(124,242,255,0.15);

  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(.96);
  z-index: 10;

  visibility: hidden;
  opacity: 0;
  transition: opacity .18s ease, transform .18s ease;
}

/* ✅ open-popup 时显示 + 动画 */
.adminPopup.open-popup,
.gmPopup.open-popup{
  visibility: visible;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* inputs 统一好看一点 */
.adminPopup input,
.gmPopup input{
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1.5px solid #d8d3e6;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
}

.popupBtns button{
  flex: 1;
  height: 36px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}

/* 第一个按钮当 Cancel */
.popupBtns button:first-child{
  background: #f2f2f6;
  color: #333;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}
.popupBtns button:first-child:hover{
  background: #e9e9ef;
  transform: translateY(-1px);
}

/* 第二个按钮当 OK */
.popupBtns button:last-child{
  color: white;
  background: linear-gradient(90deg, #5a23a1, #3b7bff);
  box-shadow: 0 8px 18px rgba(90,35,161,0.35);
}
.popupBtns button:last-child:hover{
  filter: brightness(1.05);
  transform: translateY(-1px);
}

.popupBtns button:active{
  transform: translateY(1px);
}
.adminPopup,
.gmPopup{
  color: #1a102a;   /* ✅ 黑/深紫 */
}

/* label 单独再压深一点也可以 */
.adminPopup label,
.gmPopup label{
  color: #1a102a;
  font-weight: 700;
}

.adminPopup input,
.gmPopup input{
  color: #111;
}

.adminPopup input::placeholder,
.gmPopup input::placeholder{
  color: #888;
}

.adminPopup input:focus,
.gmPopup input:focus{
  border-color: #7cf2ff;
  box-shadow: 0 0 0 3px rgba(124,242,255,.25);
}

.guestPopup.open-popup,
.adminPopup.open-popup,
.gmPopup.open-popup{
  visibility: visible;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

    /* 标题 */
.guestPopup .popup-title{
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .03em;
  color: #1a102a;
  text-align: center;
}
.guestPopup .popup-label{
  font-size: 13px;
  font-weight: 600;
  color: #3b3350;
  margin-top: 6px;
}

.guestPopup .popup-select{
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  border-radius: 12px;
  border: 1.5px solid #d8d3e6;
  background: #fff;
  outline: none;
  box-sizing: border-box;

  transition: border .15s ease, box-shadow .15s ease;
}

.guestPopup .popup-select:focus{
  border-color: #7cf2ff;
  box-shadow: 0 0 0 3px rgba(124,242,255,.25);
}

 .popupBtns{
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 6px;
}

.popupBtns .popup-btn{
  flex: 1;
  height: 36px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}

/* Cancel：灰白玻璃 */
.popupBtns .popup-btn-cancel{
  background: #f2f2f6;
  color: #333;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}
.popupBtns .popup-btn-cancel:hover{
  background: #e9e9ef;
  transform: translateY(-1px);
}

/* OK：紫蓝渐层 */
.popupBtns .popup-btn-ok{
  color: white;
  background: linear-gradient(90deg, #5a23a1, #3b7bff);
  box-shadow: 0 8px 18px rgba(90,35,161,0.35);
}
.popupBtns .popup-btn-ok:hover{
  filter: brightness(1.05);
  transform: translateY(-1px);
}

.popupBtns .popup-btn:active{
  transform: translateY(1px);
}
    .msgOverlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  visibility: hidden;
  opacity: 0;
  transition: opacity .15s ease;
  z-index: 20;
}

.msgModal{
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(.98);
  min-width: 220px;
  max-width: 320px;
  padding: 18px 16px;
  border-radius: 16px;

  background: rgba(255,255,255,0.95);
  color: #111;
  text-align: center;
  font-size: 15px;
  font-weight: 600;

  box-shadow:
    0 18px 40px rgba(0,0,0,0.35),
    0 0 0 1px rgba(255,255,255,0.7);

  visibility: hidden;
  opacity: 0;
  transition: opacity .15s ease, transform .15s ease;
  z-index: 21;
}

.msgModal.show{
  visibility: visible;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.msgOverlay.show{
  visibility: visible;
  opacity: 1;
}

.msgBtns{
  display: flex;
  justify-content: center;
  margin-top: 12px;
}

.msgBtns button{
  padding: 6px 18px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  background: #007bff;
  color: #fff;
  box-shadow: 0 3px 0 rgba(0,0,0,0.25);
}

.msgBtns button:active{
  transform: translateY(1px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25);
}


  </style>
</head>
<body>
  <!-- Overlay Background -->
  <div class="overlay" id="overlay"></div>

  <!-- Button Options -->
  <div class="btns">
    <button class="btn-admin" onclick="openAdminPopup()">Admin</button>
    <button class="btn-gm" onclick="openGMPopup()">GM</button>
    <button class="btn-guest" onclick="openGuestPopup()">Guest</button>
  </div>

  <!-- Admin Popup -->
  <div class="adminPopup" id="popupAdmin">
    <label for="idAdmin">Admin ID:</label>
    <input type="text" id="adminId">
    <label for="pwAdmin">PW:</label>
    <input type="password" id="adminPw">
    <div class="popupBtns">
      <button onclick="closeAdminPopup()">Cancel</button>
      <button onclick="submitAdminLogin()">OK</button>
    </div>
  </div>

  <!-- GM Popup -->
  <div class="gmPopup" id="popupGM">
    <label for="idGM">GM ID:</label>
    <input type="text" id="gmId">
    <label for="pwGM">PW:</label>
    <input type="password" id="gmPw">
    <div class="popupBtns">
      <button onclick="closeGMPopup()">Cancel</button>
      <button onclick="submitGMLogin()">OK</button>
    </div>
  </div>

  <!-- Guest Popup -->
  <div class="guestPopup" id="popupGuest">
    <h2 class="popup-title">Choose your team</h2>

    <label for="teams" class="popup-label">Team number</label>
    <select name="team" id="teams" class="popup-select">
      <option value="">Select…</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
    </select>

    <div class="popupBtns">
      <button class="popup-btn popup-btn-cancel" onclick="closeGuestPopup()">Cancel</button>
      <button class="popup-btn popup-btn-ok" onclick="submitTeam()">OK</button>
    </div>
  </div>

  <div class="msgOverlay" id="msgOverlay"></div>

  <div class="msgModal" id="msgModal">
    <p id="msgText">Message here</p>
    <div class="msgBtns">
      <button id="msgOkBtn">OK</button>
    </div>
  </div>


  <script>
    const adminId = document.getElementById("adminId");
    const adminPw = document.getElementById("adminPw");

    const gmId = document.getElementById("gmId");
    const gmPw = document.getElementById("gmPw");

    const popupAdmin = document.getElementById("popupAdmin");
    const popupGM = document.getElementById("popupGM");
    const popupGuest = document.getElementById("popupGuest");
    const overlay = document.getElementById("overlay");

    const msgOverlay = document.getElementById("msgOverlay");
    const msgModal = document.getElementById("msgModal");
    const msgText = document.getElementById("msgText");
    const msgOkBtn = document.getElementById("msgOkBtn");

    let msgOkCallback = null;

    function showMsg(message, onOk){
      msgText.textContent = message;
      msgOkCallback = onOk || null;

      msgOverlay.classList.add("show");
      msgModal.classList.add("show");
    }

    function closeMsg(){
      msgOverlay.classList.remove("show");
      msgModal.classList.remove("show");

      if (msgOkCallback){
        const cb = msgOkCallback;
        msgOkCallback = null;
        cb();
      }
    }

    msgOkBtn.addEventListener("click", closeMsg);
    msgOverlay.addEventListener("click", closeMsg);

    function openAdminPopup() {
      popupAdmin.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeAdminPopup() {
      popupAdmin.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function openGMPopup() {
      popupGM.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeGMPopup() {
      popupGM.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function openGuestPopup() {
      popupGuest.classList.add("open-popup");
      overlay.classList.add("show");
    }

    function closeGuestPopup() {
      popupGuest.classList.remove("open-popup");
      overlay.classList.remove("show");
    }

    function submitAdminLogin() {
      const enteredId = adminId.value.trim();
      const enteredPw = adminPw.value.trim();

      db.collection("authentication").doc("admin").get()
        .then((doc) => {
          if (doc.exists) {
            const data = doc.data();
            const correctId = data.id;
            const correctPw = data.password;

            if (enteredId === correctId && enteredPw === correctPw) {
              showMsg("Welcome!", () => {
                location.href = "admin.html";
              });
              return;
            } else if (enteredId !== correctId && enteredPw === correctPw) {
              showMsg("Id incorrect!");
            } else if (enteredId === correctId && enteredPw !== correctPw) {
              alert("Password incorrect!");
            } else {
              alert("Id and Password incorrect!");
            }
          } else {
            alert("Admin credentials not found in database.")
          }
        })
        .catch((error) => {
          console.error("Error retrieving admin credentials:", error);
          alert("Something went wrong. Please try again later.");
        })
    }

    function submitGMLogin() {
      const enteredId = gmId.value.trim();
      const enteredPw = gmPw.value.trim();

      if (!enteredId || !enteredPw) {
        showMsg("Please enter both ID and password.");
        return;
      }

      db.collection("authentication").doc("gamemaster").get()
        .then(doc => {
          if (!doc.exists) {
            alert("No GM data found.");
            return;
          }

          const accounts = doc.data().accounts;

          for (const key in accounts) {
            const account = accounts[key];
            if (account.id === enteredId) {
              if (account.password === enteredPw) {
                showMsg("Welcome GM " + enteredId, () => {
                  location.href = `gm.html?id=${enteredId}`;
                });

                location.href = `gm.html?id=${enteredId}`;
                return;
              } else {
                alert("Incorrect password");
                return;
              }
            }
          }

          alert("GM ID not found.");
        })
        .catch(error => {
          console.error("Error checking GM credentials:", error);
          alert("Something went wrong.")
        });
    }

    //   db.collection("authentication").doc("gamemaster").get()
    //     .then(doc => {
    //       if (!doc.exists) {
    //         alert("No GM data found.");
    //         return;
    //       }

    //       const accounts = doc.data().accounts;

    //       // Look through the GM accounts
    //       for (const key in accounts) {
    //         const account = accounts[key];
    //         if (account.id === inputId) {
    //           if (account.password === inputPassword) {
    //             alert("Welcome GM " + inputId);
    //             // redirect or continue
    //             return;
    //           } else {
    //             alert("Incorrect password.");
    //             return;
    //           }
    //         }
    //       }

    //       alert("GM ID not found.");
    //     })
    //     .catch(error => {
    //       console.error("Error checking GM credentials:", error);
    //       alert("Something went wrong.");
    //     });
    // }


    function submitTeam() {
      const team = document.getElementById("teams").value;
      if (!team) {
        showMsg("Please select a team.");
        return;
      }

      showMsg("Selected team: " + team, () => {
        location.href = `guest.html?team=${team}`;
      });
    }
  </script>
  <script src="dbInsert.js"></script>
</body>
</html>
