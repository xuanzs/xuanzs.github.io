            border-radius: 10px;

        .right button:hover {

            });
            r2Selects.forEach(select => {
                select.disabled = true;
            });
            r1Selects.forEach(select => {

            });
            r1P1.disabled = false;
            r1S1.disabled = false;
        }

        function ableSelects(row) {
            let currentSelects;

            if (row === 1) {
                currentSelects = document.querySelectorAll('.r1 select');
            } else if (row === 2) {
                currentSelects = document.querySelectorAll('.r2 select');
            } else if (row === 3) {
                currentSelects = document.querySelectorAll('.r3 select');
            } else if (row === 4) {
                currentSelects = document.querySelectorAll('.r4 select');
            }
            
            currentSelects.forEach(select => {
                select.disabled = false;
            })
            
        }
