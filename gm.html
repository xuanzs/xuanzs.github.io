      .container {

      }

      .left {
        display: flex;
        flex-direction: column;

        align-items: center;
        padding-left: 10%;
        padding-right: 20%;
        gap: 100px;
      }

      .left button {
        cursor: pointer;
        padding: 20px;
        font-size: 20px;
        border: none;
        border-radius: 15px;
      }

      .right {

        align-items: center;

      }

      .rows {

        align-items: center;
        gap: 30px;
      }

      .row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 50px;
      }

      .top {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .bottom {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      select {
        width: 70px;
        height: 30px;
        border-radius: 10px;
        cursor: pointer;
      }

      .right button {
        font-size: 20px;
        font-family: "Times New Roman", Times, serif;
        cursor: pointer;
        margin: 10px;
        width: 70%;
        height: 50px;
        border: none;
        border-radius: 10px;
        background: white;
      }
      .right button:hover {
        transition: 0.3s;
        background: rgb(172, 172, 172);
      }

      .overlay-2 {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 24px;
